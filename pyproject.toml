[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homepiggy"
version = "0.1.0"
description = "Glidepath fund model for first-time home buyers (NL, UK, DE)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["homepiggy*"]

[tool.setuptools.package-data]
"homepiggy.data.nl" = ["*.yaml", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
