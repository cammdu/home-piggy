  partial_exemption:
    equity_fund: 0.30         # § 20 Abs. 1 InvStG: Aktienfonds (> 50% equity; § 2 Abs. 6)
    mixed_fund: 0.15          # § 20 Abs. 2: Mischfonds (>= 25% equity; § 2 Abs. 7)
    other: 0.0
    equity_fund_threshold: 0.51
    mixed_fund_threshold: 0.25
  vorabpauschale:
    base_rate_2026: 0.0320    # Basiszins zum 2.1.2026, BMF-Schreiben 13.1.2026
    factor: 0.70
    rule: "Basisertrag = value at start of year x 70% x Basiszins, capped at the year's increase in value; reduced by 1/12 for each full month before the month of purchase (§ 18 Abs. 1-2 InvStG)."
  fictitious_sale: "On a change of partial-exemption category the units count as sold and re-bought; the gain is taxed only when the units are actually sold (§ 22 Abs. 1 and 3 InvStG)."
  source: "https://www.gesetze-im-internet.de/invstg_2018/__18.html"
  source_exemption: "https://www.gesetze-im-internet.de/invstg_2018/__20.html"
  source_fictitious_sale: "https://www.gesetze-im-internet.de/invstg_2018/__22.html"
  source_base_rate: "https://www.otto-schmidt.de/news/steuerrecht/basiszins-zur-berechnung-der-vorabpauschale-gem-18-absatz-4-invstg-basiszins-zum-2-1-2026-2026-01-15.html"
  verification: primary
  base_rate_verification: secondary
  base_rate_projection: "Assumption: the Basiszins stays at its 2026 value in later years."
  equity_share_note: "Assumption: the protected-equity sleeve holds equities physically and counts towards the equity share."
