notary_land_registry:
  notary_rate: 0.010          # notary fees ~1.0% of the price, plus 19% VAT
  notary_vat: 0.19
  land_registry_rate: 0.005   # court / land-register fees ~0.5%
  source: "https://de.wikipedia.org/wiki/Nebenkosten_beim_Grundst%C3%BCckskauf"
  verification: secondary
  note: "Statutory fee tables (GNotKG) give these approximately; the percentages are typical values. Estate-agent commission is optional and not included (enter it as other costs)."

lending:
  max_ltv: 1.00
  max_ltv_note: "No statutory loan-to-value cap in Germany; full financing of the price is offered, buying costs must be paid in cash."
  max_ltv_verification: assumption
  payment_share_of_net_income: 0.35
  initial_repayment_rate: 0.02
  rule_source: "https://www.drklein.de/einkommen-baufinanzierung-faq-1.html"
  rule_note: "Rule of thumb: monthly payment at most 35-40% of household net income (lower end used). The annuity is (mortgage rate + initial repayment 2%) x loan / 12."
  rule_verification: secondary
  initial_repayment_verification: assumption

