  rate: 0.25
  solidarity: 0.055                         # on the 25%, no exemption limit (§ 3 Abs. 3 Satz 2, § 4 Satz 3 SolZG)
  saver_allowance_eur: 1000                 # Sparer-Pauschbetrag, § 20 Abs. 9 EStG
  church_tax: none
  source: "https://www.gesetze-im-internet.de/estg/__20.html"
